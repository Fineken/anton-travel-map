<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карта путешествий Антона</title>
<meta name="description" content="Интерактивная карта путешествий по постам Telegram-канала @Anton_Yabloko">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22%23e4572e%22/%3E%3Cpath d=%22M9 20c4-8 10 0 14-8%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="map" aria-label="Карта"></main>

  <aside id="panel" aria-label="Поездки">
    <div class="grip" id="grip" aria-hidden="true"></div>
    <header class="head">
      <div class="eyebrow">Дневник дорог</div>
      <h1>Путешествия Антона</h1>
      <p class="sub">По постам канала <a href="https://t.me/Anton_Yabloko" target="_blank" rel="noopener">@Anton_Yabloko</a></p>
      <button id="togglePanel" class="icon-btn" aria-label="Свернуть панель" title="Свернуть панель">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>
    <div id="dataBadge" class="badge hidden"></div>
    <div id="stats" class="stats"></div>

    <div id="listView">
      <div class="section-title"><span>Поездки</span><button id="allToggle" class="link-btn">скрыть все</button></div>
      <ul id="trips"></ul>
    </div>

    <div id="tripView" class="hidden">
      <button id="backBtn" class="back"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Все поездки</button>
      <div id="tripHead"></div>
      <ol id="stops"></ol>
    </div>

    <footer class="opts">
      <label class="switch"><input type="checkbox" id="showLow" checked autocomplete="off"><span></span>неточные места</label>
      <label class="switch"><input type="checkbox" id="joinTrips" autocomplete="off"><span></span>связать поездки между собой</label>
    </footer>
  </aside>

  <button id="openPanel" class="fab hidden" aria-label="Показать панель">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>

  <div id="timeline">
    <button id="play" class="play" aria-label="Проиграть маршрут">
      <svg class="i-play" viewBox="0 0 24 24" width="18" height="18"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" width="18" height="18"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
    </button>
    <div class="track">
      <input type="range" id="slider" autocomplete="off" min="0" max="0" value="0" step="1" aria-label="Дата">
      <div id="ticks" class="ticks"></div>
    </div>
    <div class="when"><span id="sliderLabel"></span><small id="sliderPlace"></small></div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
